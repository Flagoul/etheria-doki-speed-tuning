<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Is your DPS moving last with Doki</title>
<style>
body{font-family:system-ui;margin:0;background:#111827;color:#eee}.wrap{max-width:1200px;margin:auto;padding:20px}
.controls,.chart{background:#1f2937;border:1px solid #3b475a;border-radius:12px;padding:14px;margin:12px 0}
.controls{display:flex;flex-direction:column;gap:10px}
.control-row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
label{font-size:12px;color:#b8c2d1;display:flex;flex-direction:column;gap:4px}
input,select,button{padding:8px;border-radius:6px;border:1px solid #4b5563;background:#273449;color:#fff}button{background:#eee;color:#111;font-weight:bold;cursor:pointer}
canvas{width:100%;max-width:800px;height:auto;background:#111827;display:block;cursor:crosshair}
.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{padding:7px 10px;background:#1f2937;border:1px solid #3b475a;border-radius:7px;font-size:13px}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:#cbd5e1}.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
#tip{position:fixed;display:none;background:#0b1020;border:1px solid #59677f;border-radius:6px;padding:8px;pointer-events:none;font-size:12px}
#status{font-size:12px;color:#9fb0c6;margin-top:6px}
.chart-body{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.chart-left{flex:1 1 480px;min-width:280px}
.trace-panel{flex:1 1 320px;min-width:260px;max-height:800px;overflow-y:auto;background:#111827;border:1px solid #3b475a;border-radius:8px;padding:12px;font-size:12px;line-height:1.5}
.trace-panel h3{margin:0 0 6px 0;font-size:14px;color:#fff}
.trace-panel .trace-placeholder{color:#8a97ab}
.trace-panel .trace-header{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #2b3546}
.trace-panel .trace-hit{margin:8px 0;padding:6px 8px;background:#1a2333;border-radius:6px}
.trace-panel .trace-hit-title{color:#9fb0c6;font-weight:bold;margin-bottom:4px}
.trace-panel .trace-state{margin:3px 0;padding-left:4px}
.trace-panel .trace-recipient{color:#f4df1a}
.trace-panel .trace-final{margin-top:10px;padding-top:8px;border-top:1px solid #2b3546}
.trace-panel .trace-final-line{margin:3px 0}
</style></head>
<body><div class="wrap">
<h1>Is your DPS moving last with Doki</h1>
<p>If you want to know whether your Mass or Xiada is moving last to get all the buffs of your team, this is for you.</p>
<div class="controls">
<div class="control-row">
<label>Team<select id="teamSizeSelect"><option value="3">3 Character Team</option><option value="4">4 Character Team</option></select></label>
</div>
<div class="control-row">
<label>Doki Speed<input id="dokiSpeedInput" type="number" value="375"></label>
<div id="fourCharacterControls" style="display:none;gap:12px;align-items:end">
<label>Fixed Character<select id="fixedCharacterSelect"><option value="DPS">DPS</option><option value="Support">Support</option><option value="Support2">Support 2</option></select></label>
<label>Fixed Speed<input id="fixedSpeedInput" type="number" value="216"></label>
</div>
</div>
<div class="control-row">
<label>Min<input id="minSpeedInput" type="number" value="200"></label>
<label>Max<input id="maxSpeedInput" type="number" value="375"></label>
<label>Tie Tolerance %<input id="tieTolerancePercentInput" type="number" value="0.5" step="0.1" min="0"></label>
<label>Push Amount (TM pts)<input id="pushAmountInput" type="number" value="12" step="1"></label>
<button onclick="draw()">Calculate</button>
</div>
</div>
<div id="stats" class="stats"></div>
<div id="status"></div>
<div class="chart">
<div class="chart-body">
<div class="chart-left">
<canvas id="heatmapCanvas" width="800" height="800"></canvas>
<div class="legend"><span><i class="sw" style="background:#4b155e"></i>DPS NOT LAST</span><span><i class="sw" style="background:#3b82a0"></i>DPS LAST</span><span><i class="sw" style="background:#19a89b"></i>TIE-BREAKER</span><span><i class="sw" style="background:#f4df1a"></i>RANDOM</span></div>
</div>
<div id="tracePanel" class="trace-panel"><p class="trace-placeholder">Click a cell in the heatmap to see Doki's tick-by-tick push trace for that matchup.</p></div>
</div>
</div>
</div><div id="tip"></div>
<script>
const heatmapCanvas = document.getElementById('heatmapCanvas');
const ctx = heatmapCanvas.getContext('2d');
const tooltipEl = document.getElementById('tip');
const statusEl = document.getElementById('status');
const tracePanelEl = document.getElementById('tracePanel');
const outcomeColors = ['#4b155e', '#3b82a0', '#19a89b', '#f4df1a'];
const HIT_COUNT = 8;

// ---------- Core exact-decimal TM model ----------

// Initial TM is unrounded: (character speed / Doki speed) * 100
function initialTurnMeter(characterSpeed, dokiSpeed){
  return characterSpeed / dokiSpeed * 100;
}

// Two TM values are effectively tied when |TM1-TM2| <= tieToleranceFraction * max(TM1,TM2)
// tieToleranceFraction defaults to 0.005 (0.5%) but is configurable from the UI.
function isTurnMeterTie(turnMeter1, turnMeter2, tieToleranceFraction){
  const difference = Math.abs(turnMeter1 - turnMeter2);
  const tolerance = tieToleranceFraction * Math.max(turnMeter1, turnMeter2);
  return difference <= tolerance;
}

// Simulate `hitCount` pushes of `pushAmount` TM against a set of initial TM values
// (DPS, Support[, Support 2]). After every push, every character within the
// tolerance of the current minimum is a possible recipient, so the simulation
// branches into every tied outcome. Returns every possible final state as an
// array of turn-meter arrays.
function simulateFinalTurnMeterStates(initialTurnMeters, hitCount, tieToleranceFraction, pushAmount){
  let candidateStates = [initialTurnMeters.slice()];
  for (let hit = 0; hit < hitCount; hit++){
    const nextStates = new Map();
    for (const state of candidateStates){
      let minimumTurnMeter = state[0];
      for (let i = 1; i < state.length; i++){
        if (state[i] < minimumTurnMeter) minimumTurnMeter = state[i];
      }
      for (let i = 0; i < state.length; i++){
        if (isTurnMeterTie(state[i], minimumTurnMeter, tieToleranceFraction)){
          const nextState = state.slice();
          nextState[i] += pushAmount;
          const stateKey = nextState.map(v => v.toFixed(6)).join('|');
          if (!nextStates.has(stateKey)) nextStates.set(stateKey, nextState);
        }
      }
    }
    candidateStates = Array.from(nextStates.values());
  }
  return candidateStates;
}

// Final-order verdict for DPS in a single branch.
// Returns bit 1 = DPS acts last (TRUE), bit 2 = DPS does not act last (FALSE),
// bit 4 = UNKNOWN / equal-TM-and-equal-Speed tie-breaker.
function verdictForDPS(dpsFinalTurnMeter, dpsSpeed, opponents, tieToleranceFraction){
  let dpsAheadOfSomeone = false;
  let unresolvedTie = false;
  for (const opponent of opponents){
    if (isTurnMeterTie(dpsFinalTurnMeter, opponent.turnMeter, tieToleranceFraction)){
      if (dpsSpeed < opponent.speed) continue;            // DPS behind this opponent
      else if (dpsSpeed > opponent.speed) dpsAheadOfSomeone = true;
      else unresolvedTie = true;                            // equal TM, equal Speed
    } else if (dpsFinalTurnMeter < opponent.turnMeter){
      continue;                                              // DPS behind this opponent
    } else {
      dpsAheadOfSomeone = true;                              // DPS ahead of this opponent
    }
  }
  if (dpsAheadOfSomeone) return 2;
  if (unresolvedTie) return 4;
  return 1;
}

// Classify a full cell: run every branch, OR together every branch's verdict bit.
// mask==1 -> always TRUE, mask==2 -> always FALSE, mask==4 -> always UNKNOWN,
// anything else (multiple bits set) -> RANDOM (branches disagree).
function classifyOutcome(initialTurnMeters, speeds, dpsIndex, tieToleranceFraction, pushAmount){
  const finalStates = simulateFinalTurnMeterStates(initialTurnMeters, HIT_COUNT, tieToleranceFraction, pushAmount);
  let outcomeMask = 0;
  for (const state of finalStates){
    const dpsFinalTurnMeter = state[dpsIndex];
    const opponents = [];
    for (let i = 0; i < state.length; i++){
      if (i === dpsIndex) continue;
      opponents.push({ turnMeter: state[i], speed: speeds[i] });
    }
    outcomeMask |= verdictForDPS(dpsFinalTurnMeter, speeds[dpsIndex], opponents, tieToleranceFraction);
    if (outcomeMask === 7) break; // already RANDOM (all three outcomes present)
  }
  return outcomeMask;
}

function classifyThreeCharacterTeam(dpsSpeed, supportSpeed, dokiSpeed, tieToleranceFraction, pushAmount){
  const dpsInitialTM = initialTurnMeter(dpsSpeed, dokiSpeed);
  const supportInitialTM = initialTurnMeter(supportSpeed, dokiSpeed);
  return classifyOutcome([dpsInitialTM, supportInitialTM], [dpsSpeed, supportSpeed], 0, tieToleranceFraction, pushAmount);
}
function classifyFourCharacterTeam(dpsSpeed, supportSpeed, support2Speed, dokiSpeed, tieToleranceFraction, pushAmount){
  const dpsInitialTM = initialTurnMeter(dpsSpeed, dokiSpeed);
  const supportInitialTM = initialTurnMeter(supportSpeed, dokiSpeed);
  const support2InitialTM = initialTurnMeter(support2Speed, dokiSpeed);
  return classifyOutcome([dpsInitialTM, supportInitialTM, support2InitialTM], [dpsSpeed, supportSpeed, support2Speed], 0, tieToleranceFraction, pushAmount);
}
function outcomeLabel(mask){
  if (mask === 1) return 'DPS LAST';
  if (mask === 2) return 'DPS NOT LAST';
  if (mask === 4) return 'TIE-BREAKER (unknown)';
  return 'RANDOM';
}

// Compares two characters for final turn order: higher TM acts first; if tied
// within tolerance, higher Speed acts first; if both TM and Speed are equal,
// the order between them is unresolved (returns 0).
function compareFinalOrder(tmA, speedA, tmB, speedB, tieToleranceFraction){
  if (isTurnMeterTie(tmA, tmB, tieToleranceFraction)){
    if (speedA !== speedB) return speedB - speedA;
    return 0;
  }
  return tmB - tmA;
}

// Builds one line showing the whole team's final state, ordered from first
// mover to last mover. An unresolved tie (equal TM and equal Speed) between
// neighbors is shown with "≈" instead of "→".
function buildTurnOrderLine(names, tmValues, speeds, tieToleranceFraction){
  const order = names.map((_, i) => i).sort((a, b) => compareFinalOrder(tmValues[a], speeds[a], tmValues[b], speeds[b], tieToleranceFraction));
  const parts = [];
  for (let k = 0; k < order.length; k++){
    const i = order[k];
    parts.push(names[i] + ' ' + tmValues[i].toFixed(4));
    if (k < order.length - 1){
      const j = order[k + 1];
      const unresolvedTie = isTurnMeterTie(tmValues[i], tmValues[j], tieToleranceFraction) && speeds[i] === speeds[j];
      parts.push(unresolvedTie ? ' \u2248 ' : ' \u2192 ');
    }
  }
  return parts.join('');
}

// ---------- Tick-by-tick trace (for the click panel) ----------

// Builds, hit by hit, the distinct states reachable so far. Each entry records
// which character(s) receiving this push led to it (usually exactly one; a
// label with "or" means two different branches independently converged on the
// same exact TM values).
function computeTraceLevels(initialTurnMeters, names, tieToleranceFraction, pushAmount, hitCount){
  let currentLevel = [{ tm: initialTurnMeters.slice(), recipients: null }];
  const levels = [currentLevel];
  for (let hit = 1; hit <= hitCount; hit++){
    const nextMap = new Map();
    for (const entry of currentLevel){
      const state = entry.tm;
      let minimumTurnMeter = state[0];
      for (let i = 1; i < state.length; i++){
        if (state[i] < minimumTurnMeter) minimumTurnMeter = state[i];
      }
      for (let i = 0; i < state.length; i++){
        if (isTurnMeterTie(state[i], minimumTurnMeter, tieToleranceFraction)){
          const nextState = state.slice();
          nextState[i] += pushAmount;
          const key = nextState.map(v => v.toFixed(6)).join('|');
          if (!nextMap.has(key)) nextMap.set(key, { tm: nextState, recipientSet: new Set([names[i]]) });
          else nextMap.get(key).recipientSet.add(names[i]);
        }
      }
    }
    currentLevel = Array.from(nextMap.values()).map(e => ({ tm: e.tm, recipients: Array.from(e.recipientSet).join(' or ') }));
    levels.push(currentLevel);
  }
  return levels;
}

function renderTracePanel(names, speeds, dokiSpeed, tieToleranceFraction, pushAmount, outcomeMask){
  const initialTurnMeters = names.map((n, i) => initialTurnMeter(speeds[i], dokiSpeed));
  const levels = computeTraceLevels(initialTurnMeters, names, tieToleranceFraction, pushAmount, HIT_COUNT);

  const matchupLine = names.map((n, i) => n + ' ' + speeds[i] + ' spd').join(' vs ') + ' (Doki ' + dokiSpeed + ' spd)';
  let html = '<div class="trace-header"><h3>' + matchupLine + '</h3>';
  html += '<div>Overall cell result: <b>' + outcomeLabel(outcomeMask) + '</b></div>';
  html += '<div>Initial TM: ' + names.map((n, i) => n + '=' + initialTurnMeters[i].toFixed(4)).join(', ') + '</div></div>';

  for (let hit = 1; hit <= HIT_COUNT; hit++){
    const level = levels[hit];
    html += '<div class="trace-hit"><div class="trace-hit-title">Hit ' + hit + (level.length > 1 ? ' — branches (' + level.length + ')' : '') + '</div>';
    for (const entry of level){
      html += '<div class="trace-state">push &rarr; <span class="trace-recipient">' + entry.recipients + '</span> &nbsp; ' +
        names.map((n, i) => n + '=' + entry.tm[i].toFixed(4)).join(', ') + '</div>';
    }
    html += '</div>';
  }

  const finalLevel = levels[HIT_COUNT];
  html += '<div class="trace-final"><div class="trace-hit-title">Final verdict per branch</div>';
  for (const entry of finalLevel){
    const opponents = [];
    for (let i = 1; i < names.length; i++) opponents.push({ turnMeter: entry.tm[i], speed: speeds[i] });
    const verdictMask = verdictForDPS(entry.tm[0], speeds[0], opponents, tieToleranceFraction);
    const turnOrderLine = buildTurnOrderLine(names, entry.tm, speeds, tieToleranceFraction);
    html += '<div class="trace-final-line">' + turnOrderLine + ' &nbsp;&mdash;&nbsp; <b>' + outcomeLabel(verdictMask) + '</b></div>';
  }
  html += '</div>';

  tracePanelEl.innerHTML = html;
}

// ---------- UI / heatmap rendering ----------

function draw(){
  statusEl.textContent = 'Calculating...';
  // let the browser paint the status text before the (possibly heavy) sync work
  setTimeout(runDraw, 0);
}

function runDraw(){
  const startTime = performance.now();
  const dokiSpeed = +document.getElementById('dokiSpeedInput').value;
  const minSpeed = +document.getElementById('minSpeedInput').value;
  const maxSpeed = +document.getElementById('maxSpeedInput').value;
  const isFourCharacterTeam = document.getElementById('teamSizeSelect').value == '4';
  const fixedCharacter = document.getElementById('fixedCharacterSelect').value;
  const fixedSpeed = +document.getElementById('fixedSpeedInput').value;
  const tieToleranceFraction = (+document.getElementById('tieTolerancePercentInput').value) / 100;
  const pushAmount = +document.getElementById('pushAmountInput').value;

  const speedValues = [];
  for (let speed = minSpeed; speed <= maxSpeed; speed++) speedValues.push(speed);
  const gridSize = speedValues.length;
  const plotOriginX = 55, plotWidth = 720, plotHeight = 720;
  const cellWidth = plotWidth / gridSize, cellHeight = plotHeight / gridSize;
  const cellData = [];
  const outcomeCounts = [0, 0, 0, 0];

  ctx.clearRect(0, 0, 800, 800);
  for (let row = 0; row < gridSize; row++){
    cellData[row] = [];
    for (let col = 0; col < gridSize; col++){
      const xSpeed = speedValues[col], ySpeed = speedValues[gridSize - 1 - row];
      let outcomeMask, xAxisName, yAxisName, dpsSpeed, supportSpeed, support2Speed;
      if (!isFourCharacterTeam){
        dpsSpeed = xSpeed; supportSpeed = ySpeed; support2Speed = null;
        outcomeMask = classifyThreeCharacterTeam(dpsSpeed, supportSpeed, dokiSpeed, tieToleranceFraction, pushAmount);
        xAxisName = 'DPS'; yAxisName = 'Support';
      } else {
        if (fixedCharacter == 'DPS'){
          dpsSpeed = fixedSpeed; supportSpeed = xSpeed; support2Speed = ySpeed;
          xAxisName = 'Support'; yAxisName = 'Support 2';
        } else if (fixedCharacter == 'Support'){
          dpsSpeed = xSpeed; supportSpeed = fixedSpeed; support2Speed = ySpeed;
          xAxisName = 'DPS'; yAxisName = 'Support 2';
        } else {
          dpsSpeed = xSpeed; supportSpeed = ySpeed; support2Speed = fixedSpeed;
          xAxisName = 'DPS'; yAxisName = 'Support';
        }
        outcomeMask = classifyFourCharacterTeam(dpsSpeed, supportSpeed, support2Speed, dokiSpeed, tieToleranceFraction, pushAmount);
      }
      const colorIndex = outcomeMask == 1 ? 1 : outcomeMask == 2 ? 0 : outcomeMask == 4 ? 2 : 3;
      outcomeCounts[colorIndex]++;
      cellData[row][col] = { xSpeed, ySpeed, outcomeMask, xAxisName, yAxisName, dpsSpeed, supportSpeed, support2Speed };
      ctx.fillStyle = outcomeColors[colorIndex];
      ctx.fillRect(plotOriginX + col * cellWidth, 20 + row * cellHeight, Math.ceil(cellWidth) + 1, Math.ceil(cellHeight) + 1);
    }
  }

  ctx.fillStyle = '#ddd'; ctx.font = '12px system-ui'; ctx.textAlign = 'center';
  const tickStep = gridSize > 120 ? 25 : Math.max(1, Math.ceil(gridSize / 7));
  for (let speed = Math.ceil(minSpeed / tickStep) * tickStep; speed <= maxSpeed; speed += tickStep){
    const col = speed - minSpeed, tickX = plotOriginX + (col + .5) * cellWidth;
    ctx.fillText(speed, tickX, 760);
    const row = maxSpeed - speed, tickY = 20 + (row + .5) * cellHeight;
    ctx.textAlign = 'right'; ctx.fillText(speed, 47, tickY + 4); ctx.textAlign = 'center';
  }

  let xAxisLabel, yAxisLabel;
  if (!isFourCharacterTeam){
    xAxisLabel = 'DPS Speed'; yAxisLabel = 'Support Speed';
  } else if (fixedCharacter == 'DPS'){
    xAxisLabel = 'Support Speed'; yAxisLabel = 'Support 2 Speed';
  } else if (fixedCharacter == 'Support'){
    xAxisLabel = 'DPS Speed'; yAxisLabel = 'Support 2 Speed';
  } else {
    xAxisLabel = 'DPS Speed'; yAxisLabel = 'Support Speed';
  }
  ctx.fillText(xAxisLabel, plotOriginX + plotWidth / 2, 790);
  ctx.save(); ctx.translate(12, 380); ctx.rotate(-Math.PI / 2); ctx.fillText(yAxisLabel, 0, 0); ctx.restore();

  document.getElementById('stats').innerHTML = ['DPS NOT LAST', 'DPS LAST', 'TIE-BREAKER', 'RANDOM']
    .map((name, i) => '<div class="stat">' + name + ' <b>' + outcomeCounts[i].toLocaleString() + '</b></div>').join('');

  heatmapCanvas._plotState = { cellData, plotOriginX, cellWidth, cellHeight, speedValues, dokiSpeed, tieToleranceFraction, pushAmount, isFourCharacterTeam };
  tracePanelEl.innerHTML = '<p class="trace-placeholder">Click a cell in the heatmap to see Doki\'s tick-by-tick push trace for that matchup.</p>';
  const endTime = performance.now();
  statusEl.textContent = gridSize.toLocaleString() + '×' + gridSize.toLocaleString() + ' cells, exact TM + ' + (tieToleranceFraction * 100) + '% tolerance, push=' + pushAmount + ', computed in ' + Math.round(endTime - startTime) + ' ms.';
}

document.getElementById('teamSizeSelect').onchange = () => {
  document.getElementById('fourCharacterControls').style.display = document.getElementById('teamSizeSelect').value == '4' ? 'flex' : 'none';
  draw();
};

function getCellFromEvent(e){
  const plotState = heatmapCanvas._plotState; if (!plotState) return null;
  const rect = heatmapCanvas.getBoundingClientRect();
  const canvasX = (e.clientX - rect.left) * heatmapCanvas.width / rect.width;
  const canvasY = (e.clientY - rect.top) * heatmapCanvas.height / rect.height;
  const col = Math.floor((canvasX - plotState.plotOriginX) / plotState.cellWidth);
  const row = Math.floor((canvasY - 20) / plotState.cellHeight);
  if (col < 0 || row < 0 || col >= plotState.speedValues.length || row >= plotState.speedValues.length) return null;
  return { plotState, cell: plotState.cellData[row][col] };
}

heatmapCanvas.onmousemove = e => {
  const hit = getCellFromEvent(e);
  if (!hit){ tooltipEl.style.display = 'none'; return; }
  const { cell } = hit;
  tooltipEl.style.display = 'block';
  tooltipEl.style.left = e.clientX + 12 + 'px';
  tooltipEl.style.top = e.clientY + 12 + 'px';
  tooltipEl.innerHTML = '<b>' + cell.xAxisName + ' ' + cell.xSpeed + ' SPD</b> × <b>' + cell.yAxisName + ' ' + cell.ySpeed + ' SPD</b><br>' + outcomeLabel(cell.outcomeMask);
};
heatmapCanvas.onmouseleave = () => tooltipEl.style.display = 'none';

heatmapCanvas.onclick = e => {
  const hit = getCellFromEvent(e);
  if (!hit) return;
  const { plotState, cell } = hit;
  const names = plotState.isFourCharacterTeam ? ['DPS', 'Support', 'Support 2'] : ['DPS', 'Support'];
  const speeds = plotState.isFourCharacterTeam ? [cell.dpsSpeed, cell.supportSpeed, cell.support2Speed] : [cell.dpsSpeed, cell.supportSpeed];
  renderTracePanel(names, speeds, plotState.dokiSpeed, plotState.tieToleranceFraction, plotState.pushAmount, cell.outcomeMask);
};

draw();
</script></body></html>
