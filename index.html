<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doki team speed tuning</title>
<style>
body{font-family:system-ui;margin:0;background:#111827;color:#eee}.wrap{max-width:1200px;margin:auto;padding:20px}
.controls,.chart{background:#1f2937;border:1px solid #3b475a;border-radius:12px;padding:14px;margin:12px 0}
.controls{display:flex;flex-direction:column;gap:10px}
.control-row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
label{font-size:12px;color:#b8c2d1;display:flex;flex-direction:column;gap:4px}
input,select,button{padding:8px;border-radius:6px;border:1px solid #4b5563;background:#273449;color:#fff}button{background:#eee;color:#111;font-weight:bold;cursor:pointer}
canvas{width:100%;max-width:800px;height:auto;background:#111827;display:block;cursor:crosshair}
.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{padding:7px 10px;background:#1f2937;border:1px solid #3b475a;border-radius:7px;font-size:13px}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:#cbd5e1}.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
#tip{position:fixed;display:none;background:#0b1020;border:1px solid #59677f;border-radius:6px;padding:8px;pointer-events:none;font-size:12px}
#status{font-size:12px;color:#9fb0c6;margin-top:6px}
.chart-body{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.chart-left{flex:1 1 480px;min-width:280px}
.trace-panel{flex:1 1 320px;min-width:260px;max-height:800px;overflow-y:auto;background:#111827;border:1px solid #3b475a;border-radius:8px;padding:12px;font-size:12px;line-height:1.5}
.trace-panel h3{margin:0 0 6px 0;font-size:14px;color:#fff}
.trace-panel .trace-placeholder{color:#8a97ab}
.trace-panel .trace-header{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #2b3546}
.trace-panel .trace-hit{margin:8px 0;padding:6px 8px;background:#1a2333;border-radius:6px}
.trace-panel .trace-hit-title{color:#9fb0c6;font-weight:bold;margin-bottom:4px}
.trace-panel .trace-state{margin:3px 0;padding-left:4px}
.trace-panel .trace-recipient{color:#f4df1a}
.trace-panel .trace-final{margin-top:10px;padding-top:8px;border-top:1px solid #2b3546}
.trace-panel .trace-final-branch{margin:0 0 10px 0;padding:6px 8px;background:#1a2333;border-radius:6px}
.trace-panel .trace-final-sub{margin:3px 0}
.trace-panel .trace-final-label{color:#9fb0c6;margin-right:4px}
.trace-panel .trace-final-verdict{margin-top:4px}
</style></head>
<body><div class="wrap">
<h1>Doki team speed tuning</h1>
<p>Work in progress</p>
<div class="controls">
<div class="control-row">
<label>Team<select id="teamSizeSelect"><option value="3">3 Character Team</option><option value="4">4 Character Team</option></select></label>
</div>
<div class="control-row">
<label>Doki Speed<input id="dokiSpeedInput" type="number" value="375"></label>
<div id="fixedCharacterControls" style="display:none;gap:12px;align-items:end">
<label>Fixed Character<select id="fixedCharacterSelect"><option value="DPS">Character 1</option><option value="Support">Character 2</option><option value="Support2">Character 3</option></select></label>
<label>Fixed Speed<input id="fixedSpeedInput" type="number" value="216"></label>
</div>
<label>Character 1 Name<input id="dpsNameInput" type="text" value="Xiada"></label>
<label>Character 2 Name<input id="supportNameInput" type="text" value="Ninfoniel"></label>
<div id="support2NameControls" style="display:none;gap:12px;align-items:end">
<label>Character 3 Name<input id="support2NameInput" type="text" value="Areal"></label>
</div>
</div>
<div class="control-row">
<label>Min<input id="minSpeedInput" type="number" value="200"></label>
<label>Max<input id="maxSpeedInput" type="number" value="375"></label>
<label>Tie Tolerance %<input id="tieTolerancePercentInput" type="number" value="0.5" step="0.1" min="0"></label>
<label>Push Amount (TM pts)<input id="pushAmountInput" type="number" value="12" step="1"></label>
<label id="colorByContainer" style="display:none">Color By<select id="colorByModeSelect"><option value="dps">Character 1 Last / Not Last</option><option value="order" selected>Full Turn Order</option></select></label>
<button onclick="draw()">Calculate</button>
</div>
</div>
<div id="stats" class="stats"></div>
<div id="status"></div>
<div class="chart">
<div class="chart-body">
<div class="chart-left">
<canvas id="heatmapCanvas" width="800" height="800"></canvas>
<div id="legendContainer" class="legend"></div>
</div>
<div id="tracePanel" class="trace-panel"><p class="trace-placeholder">Click a cell in the heatmap to see Doki's tick-by-tick push trace for that matchup.</p></div>
</div>
</div>
</div><div id="tip"></div>
<script>
const heatmapCanvas = document.getElementById('heatmapCanvas');
const ctx = heatmapCanvas.getContext('2d');
const tooltipEl = document.getElementById('tip');
const statusEl = document.getElementById('status');
const tracePanelEl = document.getElementById('tracePanel');
const legendContainerEl = document.getElementById('legendContainer');
const HIT_COUNT = 8;

// DPS-mode palette: [DPS NOT LAST, DPS LAST, TIE-BREAKER, RANDOM]
const dpsModeColors = ['#4b155e', '#3b82a0', '#19a89b', '#f4df1a'];
// Full-turn-order palette: one color per permutation, reused across team sizes.
const orderPalette = ['#4b155e', '#3b82a0', '#e07b39', '#5fd068', '#eb5e8d', '#8a6fdf'];
const orderTieColor = '#19a89b';
const orderRandomColor = '#f4df1a';

// ---------- Core exact-decimal TM model ----------

// Initial TM is unrounded: (character speed / Doki speed) * 100
function initialTurnMeter(characterSpeed, dokiSpeed){
  return characterSpeed / dokiSpeed * 100;
}

// Two TM values are effectively tied when |TM1-TM2| <= tieToleranceFraction * max(TM1,TM2)
// tieToleranceFraction defaults to 0.005 (0.5%) but is configurable from the UI.
function isTurnMeterTie(turnMeter1, turnMeter2, tieToleranceFraction){
  const difference = Math.abs(turnMeter1 - turnMeter2);
  const tolerance = tieToleranceFraction * Math.max(turnMeter1, turnMeter2);
  return difference <= tolerance;
}

// Simulate `hitCount` pushes of `pushAmount` TM against a set of initial TM values
// (DPS, Support[, Support 2]). After every push, every character within the
// tolerance of the current minimum is a possible recipient, so the simulation
// branches into every tied outcome. Returns every possible final state as an
// array of turn-meter arrays.
function simulateFinalTurnMeterStates(initialTurnMeters, hitCount, tieToleranceFraction, pushAmount){
  let candidateStates = [initialTurnMeters.slice()];
  for (let hit = 0; hit < hitCount; hit++){
    const nextStates = new Map();
    for (const state of candidateStates){
      let minimumTurnMeter = state[0];
      for (let i = 1; i < state.length; i++){
        if (state[i] < minimumTurnMeter) minimumTurnMeter = state[i];
      }
      for (let i = 0; i < state.length; i++){
        if (isTurnMeterTie(state[i], minimumTurnMeter, tieToleranceFraction)){
          const nextState = state.slice();
          nextState[i] += pushAmount;
          const stateKey = nextState.map(v => v.toFixed(6)).join('|');
          if (!nextStates.has(stateKey)) nextStates.set(stateKey, nextState);
        }
      }
    }
    candidateStates = Array.from(nextStates.values());
  }
  return candidateStates;
}

// After the push sequence, everyone keeps filling TM at their own Speed until
// the next 100-multiple threshold. This is how much real "time" a character
// with a given final TM and Speed needs to reach their next action.
// TM is allowed to sit above 100 (or even above 200 with enough pushes) —
// mod 100 finds where they are within the current cycle, and (100-that)/speed
// is the remaining time. A TM sitting exactly on a threshold needs 0 time.
function timeToThreshold(turnMeter, speed){
  const remainder = turnMeter % 100;
  const remaining = (100 - remainder) % 100;
  return remaining / speed;
}

// Final-order verdict for DPS in a single branch, based on real time-to-act
// rather than raw TM: whoever needs less time to reach their next 100
// threshold acts first, regardless of which one currently shows a higher TM.
// Returns bit 1 = DPS acts last (TRUE), bit 2 = DPS does not act last (FALSE),
// bit 4 = UNKNOWN (the two times are equal within tolerance — a genuine,
// unresolved real-time tie).
function verdictForDPS(dpsFinalTurnMeter, dpsSpeed, opponents, tieToleranceFraction){
  const dpsTime = timeToThreshold(dpsFinalTurnMeter, dpsSpeed);
  let dpsAheadOfSomeone = false;
  let unresolvedTie = false;
  for (const opponent of opponents){
    const opponentTime = timeToThreshold(opponent.turnMeter, opponent.speed);
    if (isTurnMeterTie(dpsTime, opponentTime, tieToleranceFraction)){
      unresolvedTie = true;                                   // equal time-to-act, genuinely ambiguous
    } else if (dpsTime > opponentTime){
      continue;                                                // DPS needs longer -> acts after this opponent, fine
    } else {
      dpsAheadOfSomeone = true;                                // DPS needs less time -> acts before this opponent
    }
  }
  if (dpsAheadOfSomeone) return 2;
  if (unresolvedTie) return 4;
  return 1;
}

function dpsOutcomeLabel(mask, dpsDisplayName){
  const label = dpsDisplayName || 'Character 1';
  if (mask === 1) return label + ' LAST';
  if (mask === 2) return label + ' NOT LAST';
  if (mask === 4) return 'TIE-BREAKER (unknown)';
  return 'RANDOM';
}

// For 3-character teams (2 non-Doki characters), "LAST/NOT LAST" is really
// just one of the two possible turn orders, so express it the same way the
// Full Turn Order mode does for consistency, instead of DPS-specific wording.
function twoCharacterOrderLabel(mask, names){
  if (mask === 1) return names[1] + ' \u2192 ' + names[0]; // Character 1 last -> Character 2 acted first
  if (mask === 2) return names[0] + ' \u2192 ' + names[1]; // Character 1 not last -> acted first
  if (mask === 4) return 'TIE-BREAKER (unknown)';
  return 'RANDOM';
}

// Compares two characters for final turn order: whoever needs less real time
// to reach their next 100 threshold acts first. If the two times are equal
// within tolerance, the order between them is a genuine unresolved tie
// (returns 0) — Speed is already fully baked into the time calculation, so
// there's no separate Speed fallback step anymore.
function compareFinalOrder(tmA, speedA, tmB, speedB, tieToleranceFraction){
  const timeA = timeToThreshold(tmA, speedA), timeB = timeToThreshold(tmB, speedB);
  if (isTurnMeterTie(timeA, timeB, tieToleranceFraction)) return 0;
  return timeA - timeB;
}

// True if two characters are a genuine unresolved tie for final order, i.e.
// their time-to-next-threshold values are equal within tolerance.
function isFinalOrderTie(tmA, speedA, tmB, speedB, tieToleranceFraction){
  return isTurnMeterTie(timeToThreshold(tmA, speedA), timeToThreshold(tmB, speedB), tieToleranceFraction);
}

// Builds one line showing the whole team's final state, ordered from first
// mover to last mover (by time-to-next-threshold). An unresolved tie is
// shown with "≈" instead of "→".
function buildTurnOrderLine(names, tmValues, speeds, tieToleranceFraction){
  const order = names.map((_, i) => i).sort((a, b) => compareFinalOrder(tmValues[a], speeds[a], tmValues[b], speeds[b], tieToleranceFraction));
  const parts = [];
  for (let k = 0; k < order.length; k++){
    const i = order[k];
    parts.push(names[i] + ' ' + tmValues[i].toFixed(4));
    if (k < order.length - 1){
      const j = order[k + 1];
      const unresolvedTie = isFinalOrderTie(tmValues[i], speeds[i], tmValues[j], speeds[j], tieToleranceFraction);
      parts.push(unresolvedTie ? ' \u2248 ' : ' \u2192 ');
    }
  }
  return parts.join('');
}

// Builds one line showing the explicit "remaining TM ÷ Speed = time" check for
// each character, in the same first-mover-to-last-mover order, so it's clear
// exactly why a lower-TM-but-faster character can cut in front of a
// higher-TM-but-slower one.
function buildTimeToActionLine(names, tmValues, speeds, tieToleranceFraction){
  const order = names.map((_, i) => i).sort((a, b) => compareFinalOrder(tmValues[a], speeds[a], tmValues[b], speeds[b], tieToleranceFraction));
  const parts = [];
  for (let k = 0; k < order.length; k++){
    const i = order[k];
    const remainder = tmValues[i] % 100;
    const remaining = (100 - remainder) % 100;
    const time = remaining / speeds[i];
    parts.push(names[i] + ' ' + remaining.toFixed(4) + '\u00f7' + speeds[i] + '=' + time.toFixed(5));
    if (k < order.length - 1){
      const j = order[k + 1];
      const unresolvedTie = isFinalOrderTie(tmValues[i], speeds[i], tmValues[j], speeds[j], tieToleranceFraction);
      parts.push(unresolvedTie ? ' \u2248 ' : ' \u2192 ');
    }
  }
  return parts.join('');
}

// Canonical order key for a final state, e.g. "0>1>2" (DPS first, then
// Support, then Support 2) or "0>1=2" if Support and Support 2 are an
// unresolved tie (equal time-to-next-threshold) for last place.
function fullOrderKey(tmValues, speeds, tieToleranceFraction){
  const order = tmValues.map((_, i) => i).sort((a, b) => compareFinalOrder(tmValues[a], speeds[a], tmValues[b], speeds[b], tieToleranceFraction));
  const keyParts = [];
  let i = 0;
  while (i < order.length){
    const group = [order[i]];
    let j = i + 1;
    while (j < order.length && isFinalOrderTie(tmValues[order[i]], speeds[order[i]], tmValues[order[j]], speeds[order[j]], tieToleranceFraction)){
      group.push(order[j]); j++;
    }
    group.sort((a, b) => a - b);
    keyParts.push(group.join('='));
    i = j;
  }
  return keyParts.join('>');
}

// All n! non-tied orderings of n characters, e.g. for n=3:
// ["0>1>2","0>2>1","1>0>2","1>2>0","2>0>1","2>1>0"]. Used to give every
// permutation a stable, repeatable color.
function generatePermutationKeys(n){
  const indices = Array.from({ length: n }, (_, i) => i);
  const results = [];
  (function permute(current){
    if (current.length === n){ results.push(current.join('>')); return; }
    for (const v of indices){
      if (!current.includes(v)) permute([...current, v]);
    }
  })([]);
  return results;
}

function colorForOrderKey(key, permutationKeys){
  if (key.includes('=')) return orderTieColor;
  const idx = permutationKeys.indexOf(key);
  return orderPalette[idx % orderPalette.length];
}

// Color used to flag cells where the model's prediction isn't trustworthy —
// see findCrossoverPairs below for what triggers it.
const uncertainColor = '#ef4444';

// Finds every pair of characters in a final state where one has a strictly
// higher TM than the other but is also slower. When TM and Speed "agree"
// (whoever has more TM is also faster, or whoever has less TM is also
// slower), the order call is trustworthy. When they disagree — someone
// banked more TM but can't out-race a faster rival to the next threshold —
// real testing has shown the outcome isn't reliably predictable by either
// raw TM or the time-to-threshold model, so these get flagged rather than
// asserting an order we can't actually back up.
// Returns an array of [higherTmButSlowerIndex, fasterButLowerTmIndex] pairs.
function findCrossoverPairs(tmValues, speeds){
  const pairs = [];
  for (let i = 0; i < tmValues.length; i++){
    for (let j = 0; j < tmValues.length; j++){
      if (i !== j && tmValues[i] > tmValues[j] && speeds[i] < speeds[j]) pairs.push([i, j]);
    }
  }
  return pairs;
}

// Classify a full cell in one pass: runs the branch simulation once and
// returns the DPS-only verdict bitmask, the full-turn-order result
// ({type:'ORDER',key} | {type:'TIE',key} | {type:'RANDOM'}), and whether
// any branch contains an untrustworthy TM/Speed crossover.
function classifyCell(names, speeds, dokiSpeed, tieToleranceFraction, pushAmount){
  const initialTurnMeters = speeds.map(sp => initialTurnMeter(sp, dokiSpeed));
  const finalStates = simulateFinalTurnMeterStates(initialTurnMeters, HIT_COUNT, tieToleranceFraction, pushAmount);
  let dpsMask = 0;
  let isUncertain = false;
  const orderKeys = new Set();
  for (const state of finalStates){
    const opponents = [];
    for (let i = 1; i < state.length; i++) opponents.push({ turnMeter: state[i], speed: speeds[i] });
    dpsMask |= verdictForDPS(state[0], speeds[0], opponents, tieToleranceFraction);
    orderKeys.add(fullOrderKey(state, speeds, tieToleranceFraction));
    if (findCrossoverPairs(state, speeds).length > 0) isUncertain = true;
  }
  let orderResult;
  if (orderKeys.size > 1){
    orderResult = { type: 'RANDOM' };
  } else {
    const key = [...orderKeys][0];
    orderResult = key.includes('=') ? { type: 'TIE', key } : { type: 'ORDER', key };
  }
  return { dpsMask, orderResult, isUncertain };
}

// ---------- Tick-by-tick trace (for the click panel) ----------

// Builds, hit by hit, the distinct states reachable so far. Each entry records
// which character(s) receiving this push led to it (usually exactly one; a
// label with "or" means two different branches independently converged on the
// same exact TM values).
function computeTraceLevels(initialTurnMeters, names, tieToleranceFraction, pushAmount, hitCount){
  let currentLevel = [{ tm: initialTurnMeters.slice(), recipients: null }];
  const levels = [currentLevel];
  for (let hit = 1; hit <= hitCount; hit++){
    const nextMap = new Map();
    for (const entry of currentLevel){
      const state = entry.tm;
      let minimumTurnMeter = state[0];
      for (let i = 1; i < state.length; i++){
        if (state[i] < minimumTurnMeter) minimumTurnMeter = state[i];
      }
      for (let i = 0; i < state.length; i++){
        if (isTurnMeterTie(state[i], minimumTurnMeter, tieToleranceFraction)){
          const nextState = state.slice();
          nextState[i] += pushAmount;
          const key = nextState.map(v => v.toFixed(6)).join('|');
          if (!nextMap.has(key)) nextMap.set(key, { tm: nextState, recipientSet: new Set([names[i]]) });
          else nextMap.get(key).recipientSet.add(names[i]);
        }
      }
    }
    currentLevel = Array.from(nextMap.values()).map(e => ({ tm: e.tm, recipients: Array.from(e.recipientSet).join(' or ') }));
    levels.push(currentLevel);
  }
  return levels;
}

function renderTracePanel(names, speeds, dokiSpeed, tieToleranceFraction, pushAmount, dpsMask){
  const initialTurnMeters = names.map((n, i) => initialTurnMeter(speeds[i], dokiSpeed));
  const levels = computeTraceLevels(initialTurnMeters, names, tieToleranceFraction, pushAmount, HIT_COUNT);

  const matchupLine = names.map((n, i) => n + ' ' + speeds[i] + ' spd').join(' vs ') + ' (Doki ' + dokiSpeed + ' spd)';
  let html = '<div class="trace-header"><h3>' + matchupLine + '</h3>';
  html += '<div>Overall cell result: <b>' + dpsOutcomeLabel(dpsMask, names[0]) + '</b></div>';
  html += '<div>Initial TM: ' + names.map((n, i) => n + '=' + initialTurnMeters[i].toFixed(4)).join(', ') + '</div></div>';

  for (let hit = 1; hit <= HIT_COUNT; hit++){
    const level = levels[hit];
    html += '<div class="trace-hit"><div class="trace-hit-title">Hit ' + hit + (level.length > 1 ? ' — branches (' + level.length + ')' : '') + '</div>';
    for (const entry of level){
      html += '<div class="trace-state">push &rarr; <span class="trace-recipient">' + entry.recipients + '</span> &nbsp; ' +
        names.map((n, i) => n + '=' + entry.tm[i].toFixed(4)).join(', ') + '</div>';
    }
    html += '</div>';
  }

  const finalLevel = levels[HIT_COUNT];
  html += '<div class="trace-final"><div class="trace-hit-title">Final verdict per branch</div>';
  for (const entry of finalLevel){
    const opponents = [];
    for (let i = 1; i < names.length; i++) opponents.push({ turnMeter: entry.tm[i], speed: speeds[i] });
    const verdictMask = verdictForDPS(entry.tm[0], speeds[0], opponents, tieToleranceFraction);
    const turnOrderLine = buildTurnOrderLine(names, entry.tm, speeds, tieToleranceFraction);
    const timeToActionLine = buildTimeToActionLine(names, entry.tm, speeds, tieToleranceFraction);
    const crossoverPairs = findCrossoverPairs(entry.tm, speeds);
    const crossoverLines = crossoverPairs.map(([slowerIdx, fasterIdx]) =>
      '<div class="trace-final-sub" style="color:' + uncertainColor + '">\u26A0 ' + names[slowerIdx] + ' ' + entry.tm[slowerIdx].toFixed(4) +
      ' has higher TM than ' + names[fasterIdx] + ' ' + entry.tm[fasterIdx].toFixed(4) +
      ' but is slower (' + speeds[slowerIdx] + ' < ' + speeds[fasterIdx] + ') \u2014 order between them is not reliable</div>'
    ).join('');
    html += '<div class="trace-final-branch">' +
      '<div class="trace-final-sub"><span class="trace-final-label">After push:</span>' + turnOrderLine + '</div>' +
      '<div class="trace-final-sub"><span class="trace-final-label">Time to next action (remaining TM \u00f7 speed):</span>' + timeToActionLine + '</div>' +
      crossoverLines +
      '<div class="trace-final-verdict"><b>' + dpsOutcomeLabel(verdictMask, names[0]) + '</b></div>' +
      '</div>';
  }
  html += '</div>';

  tracePanelEl.innerHTML = html;
}

// ---------- UI / heatmap rendering ----------

function draw(){
  statusEl.textContent = 'Calculating...';
  // let the browser paint the status text before the (possibly heavy) sync work
  setTimeout(runDraw, 0);
}

function runDraw(){
  const startTime = performance.now();
  const dokiSpeed = +document.getElementById('dokiSpeedInput').value;
  const minSpeed = +document.getElementById('minSpeedInput').value;
  const maxSpeed = +document.getElementById('maxSpeedInput').value;
  const isFourCharacterTeam = document.getElementById('teamSizeSelect').value == '4';
  const fixedCharacter = document.getElementById('fixedCharacterSelect').value;
  const fixedSpeed = +document.getElementById('fixedSpeedInput').value;
  const tieToleranceFraction = (+document.getElementById('tieTolerancePercentInput').value) / 100;
  const pushAmount = +document.getElementById('pushAmountInput').value;
  const colorByMode = isFourCharacterTeam ? document.getElementById('colorByModeSelect').value : 'dps';

  const dpsName = document.getElementById('dpsNameInput').value || 'Character 1';
  const supportName = document.getElementById('supportNameInput').value || 'Character 2';
  const support2Name = document.getElementById('support2NameInput').value || 'Character 3';
  const names = isFourCharacterTeam ? [dpsName, supportName, support2Name] : [dpsName, supportName];
  const permutationKeys = generatePermutationKeys(names.length);

  const speedValues = [];
  for (let speed = minSpeed; speed <= maxSpeed; speed++) speedValues.push(speed);
  const gridSize = speedValues.length;
  const cellData = [];

  for (let row = 0; row < gridSize; row++){
    cellData[row] = [];
    for (let col = 0; col < gridSize; col++){
      const xSpeed = speedValues[col], ySpeed = speedValues[gridSize - 1 - row];
      let xAxisName, yAxisName, dpsSpeed, supportSpeed, support2Speed;
      if (!isFourCharacterTeam){
        dpsSpeed = xSpeed; supportSpeed = ySpeed; support2Speed = null;
        xAxisName = dpsName; yAxisName = supportName;
      } else {
        if (fixedCharacter == 'DPS'){
          dpsSpeed = fixedSpeed; supportSpeed = xSpeed; support2Speed = ySpeed;
          xAxisName = supportName; yAxisName = support2Name;
        } else if (fixedCharacter == 'Support'){
          dpsSpeed = xSpeed; supportSpeed = fixedSpeed; support2Speed = ySpeed;
          xAxisName = dpsName; yAxisName = support2Name;
        } else {
          dpsSpeed = xSpeed; supportSpeed = ySpeed; support2Speed = fixedSpeed;
          xAxisName = dpsName; yAxisName = supportName;
        }
      }
      const speeds = isFourCharacterTeam ? [dpsSpeed, supportSpeed, support2Speed] : [dpsSpeed, supportSpeed];
      const { dpsMask, orderResult, isUncertain } = classifyCell(names, speeds, dokiSpeed, tieToleranceFraction, pushAmount);
      cellData[row][col] = { xSpeed, ySpeed, xAxisName, yAxisName, dpsSpeed, supportSpeed, support2Speed, dpsMask, orderResult, isUncertain };
    }
  }

  let xAxisLabel, yAxisLabel;
  if (!isFourCharacterTeam){
    xAxisLabel = dpsName + ' Speed'; yAxisLabel = supportName + ' Speed';
  } else if (fixedCharacter == 'DPS'){
    xAxisLabel = supportName + ' Speed'; yAxisLabel = support2Name + ' Speed';
  } else if (fixedCharacter == 'Support'){
    xAxisLabel = dpsName + ' Speed'; yAxisLabel = support2Name + ' Speed';
  } else {
    xAxisLabel = dpsName + ' Speed'; yAxisLabel = supportName + ' Speed';
  }

  heatmapCanvas._plotState = { cellData, speedValues, minSpeed, maxSpeed, dokiSpeed, tieToleranceFraction, pushAmount, isFourCharacterTeam, names, permutationKeys, xAxisLabel, yAxisLabel };
  tracePanelEl.innerHTML = '<p class="trace-placeholder">Click a cell in the heatmap to see Doki\'s tick-by-tick push trace for that matchup.</p>';

  paint(colorByMode);

  const endTime = performance.now();
  statusEl.textContent = gridSize.toLocaleString() + '×' + gridSize.toLocaleString() + ' cells, exact TM + ' + (tieToleranceFraction * 100) + '% tolerance, push=' + pushAmount + ', computed in ' + Math.round(endTime - startTime) + ' ms.';
}

// Repaints the canvas, stats, and legend from already-computed cellData — no
// re-simulation needed, so toggling Color By is instant.
function paint(colorByMode){
  const plotState = heatmapCanvas._plotState;
  if (!plotState) return;
  const { cellData, speedValues, minSpeed, maxSpeed, permutationKeys, names, xAxisLabel, yAxisLabel } = plotState;
  plotState.colorByMode = colorByMode;

  const gridSize = speedValues.length;
  const plotOriginX = 55, plotWidth = 720, plotHeight = 720;
  const cellWidth = plotWidth / gridSize, cellHeight = plotHeight / gridSize;

  ctx.clearRect(0, 0, 800, 800);

  const dpsCounts = [0, 0, 0, 0];
  const orderCounts = new Map(); // key -> count ('TIE' and 'RANDOM' are special keys)
  let uncertainCount = 0;

  for (let row = 0; row < gridSize; row++){
    for (let col = 0; col < gridSize; col++){
      const cell = cellData[row][col];
      let fillColor;
      if (cell.isUncertain){
        fillColor = uncertainColor;
        uncertainCount++;
      } else if (colorByMode === 'order'){
        let bucketKey;
        if (cell.orderResult.type === 'RANDOM'){ bucketKey = 'RANDOM'; fillColor = orderRandomColor; }
        else if (cell.orderResult.type === 'TIE'){ bucketKey = 'TIE'; fillColor = orderTieColor; }
        else { bucketKey = cell.orderResult.key; fillColor = colorForOrderKey(cell.orderResult.key, permutationKeys); }
        orderCounts.set(bucketKey, (orderCounts.get(bucketKey) || 0) + 1);
      } else {
        const colorIndex = cell.dpsMask == 1 ? 1 : cell.dpsMask == 2 ? 0 : cell.dpsMask == 4 ? 2 : 3;
        fillColor = dpsModeColors[colorIndex];
        dpsCounts[colorIndex]++;
      }
      ctx.fillStyle = fillColor;
      ctx.fillRect(plotOriginX + col * cellWidth, 20 + row * cellHeight, Math.ceil(cellWidth) + 1, Math.ceil(cellHeight) + 1);
    }
  }

  ctx.fillStyle = '#ddd'; ctx.font = '12px system-ui'; ctx.textAlign = 'center';
  const tickStep = gridSize > 120 ? 25 : Math.max(1, Math.ceil(gridSize / 7));
  for (let speed = Math.ceil(minSpeed / tickStep) * tickStep; speed <= maxSpeed; speed += tickStep){
    const col = speed - minSpeed, tickX = plotOriginX + (col + .5) * cellWidth;
    ctx.fillText(speed, tickX, 760);
    const row = maxSpeed - speed, tickY = 20 + (row + .5) * cellHeight;
    ctx.textAlign = 'right'; ctx.fillText(speed, 47, tickY + 4); ctx.textAlign = 'center';
  }
  ctx.fillText(xAxisLabel, plotOriginX + plotWidth / 2, 790);
  ctx.save(); ctx.translate(12, 380); ctx.rotate(-Math.PI / 2); ctx.fillText(yAxisLabel, 0, 0); ctx.restore();

  plotState.plotOriginX = plotOriginX; plotState.cellWidth = cellWidth; plotState.cellHeight = cellHeight;

  const uncertainStat = '<div class="stat"><i class="sw" style="background:' + uncertainColor + '"></i>UNCERTAIN <b>' + uncertainCount.toLocaleString() + '</b></div>';
  const uncertainLegend = '<span><i class="sw" style="background:' + uncertainColor + '"></i>UNCERTAIN (speed/TM crossover)</span>';

  if (colorByMode === 'order'){
    document.getElementById('stats').innerHTML = permutationKeys.map((key, i) => {
      const label = key.split('>').map(idx => names[+idx]).join(' \u2192 ');
      const count = orderCounts.get(key) || 0;
      return '<div class="stat"><i class="sw" style="background:' + orderPalette[i % orderPalette.length] + '"></i>' + label + ' <b>' + count.toLocaleString() + '</b></div>';
    }).join('') +
      '<div class="stat"><i class="sw" style="background:' + orderTieColor + '"></i>TIE-BREAKER <b>' + (orderCounts.get('TIE') || 0).toLocaleString() + '</b></div>' +
      '<div class="stat"><i class="sw" style="background:' + orderRandomColor + '"></i>RANDOM <b>' + (orderCounts.get('RANDOM') || 0).toLocaleString() + '</b></div>' +
      uncertainStat;
    legendContainerEl.innerHTML = permutationKeys.map((key, i) => {
      const label = key.split('>').map(idx => names[+idx]).join(' \u2192 ');
      return '<span><i class="sw" style="background:' + orderPalette[i % orderPalette.length] + '"></i>' + label + '</span>';
    }).join('') +
      '<span><i class="sw" style="background:' + orderTieColor + '"></i>TIE-BREAKER</span>' +
      '<span><i class="sw" style="background:' + orderRandomColor + '"></i>RANDOM</span>' +
      uncertainLegend;
  } else {
    const dpsLabel = names[0];
    const notLastLabel = plotState.isFourCharacterTeam ? (dpsLabel + ' NOT LAST') : twoCharacterOrderLabel(2, names);
    const lastLabel = plotState.isFourCharacterTeam ? (dpsLabel + ' LAST') : twoCharacterOrderLabel(1, names);
    document.getElementById('stats').innerHTML = [notLastLabel, lastLabel, 'TIE-BREAKER', 'RANDOM']
      .map((name, i) => '<div class="stat">' + name + ' <b>' + dpsCounts[i].toLocaleString() + '</b></div>').join('') +
      uncertainStat;
    legendContainerEl.innerHTML = '<span><i class="sw" style="background:' + dpsModeColors[0] + '"></i>' + notLastLabel + '</span>' +
      '<span><i class="sw" style="background:' + dpsModeColors[1] + '"></i>' + lastLabel + '</span>' +
      '<span><i class="sw" style="background:' + dpsModeColors[2] + '"></i>TIE-BREAKER</span>' +
      '<span><i class="sw" style="background:' + dpsModeColors[3] + '"></i>RANDOM</span>' +
      uncertainLegend;
  }
}

function syncFixedCharacterOptionLabels(){
  const dpsName = document.getElementById('dpsNameInput').value || 'Character 1';
  const supportName = document.getElementById('supportNameInput').value || 'Character 2';
  const support2Name = document.getElementById('support2NameInput').value || 'Character 3';
  const select = document.getElementById('fixedCharacterSelect');
  select.options[0].textContent = dpsName;
  select.options[1].textContent = supportName;
  select.options[2].textContent = support2Name;
}
document.getElementById('dpsNameInput').oninput = syncFixedCharacterOptionLabels;
document.getElementById('supportNameInput').oninput = syncFixedCharacterOptionLabels;
document.getElementById('support2NameInput').oninput = syncFixedCharacterOptionLabels;
syncFixedCharacterOptionLabels();

document.getElementById('teamSizeSelect').onchange = () => {
  const isFour = document.getElementById('teamSizeSelect').value == '4';
  document.getElementById('fixedCharacterControls').style.display = isFour ? 'flex' : 'none';
  document.getElementById('support2NameControls').style.display = isFour ? 'flex' : 'none';
  document.getElementById('colorByContainer').style.display = isFour ? 'flex' : 'none';
  draw();
};
document.getElementById('colorByModeSelect').onchange = () => paint(document.getElementById('colorByModeSelect').value);

function getCellFromEvent(e){
  const plotState = heatmapCanvas._plotState; if (!plotState || plotState.plotOriginX === undefined) return null;
  const rect = heatmapCanvas.getBoundingClientRect();
  const canvasX = (e.clientX - rect.left) * heatmapCanvas.width / rect.width;
  const canvasY = (e.clientY - rect.top) * heatmapCanvas.height / rect.height;
  const col = Math.floor((canvasX - plotState.plotOriginX) / plotState.cellWidth);
  const row = Math.floor((canvasY - 20) / plotState.cellHeight);
  if (col < 0 || row < 0 || col >= plotState.speedValues.length || row >= plotState.speedValues.length) return null;
  return { plotState, cell: plotState.cellData[row][col] };
}

heatmapCanvas.onmousemove = e => {
  const hit = getCellFromEvent(e);
  if (!hit){ tooltipEl.style.display = 'none'; return; }
  const { plotState, cell } = hit;
  tooltipEl.style.display = 'block';
  tooltipEl.style.left = e.clientX + 12 + 'px';
  tooltipEl.style.top = e.clientY + 12 + 'px';
  let bodyLine;
  if (plotState.colorByMode === 'order'){
    if (cell.orderResult.type === 'RANDOM') bodyLine = 'RANDOM';
    else if (cell.orderResult.type === 'TIE') bodyLine = 'TIE-BREAKER (unknown)';
    else bodyLine = cell.orderResult.key.split('>').map(idx => plotState.names[+idx]).join(' \u2192 ');
  } else {
    bodyLine = plotState.isFourCharacterTeam ? dpsOutcomeLabel(cell.dpsMask, plotState.names[0]) : twoCharacterOrderLabel(cell.dpsMask, plotState.names);
  }
  if (cell.isUncertain) bodyLine = '\u26A0 UNCERTAIN (speed/TM crossover)<br><span style="color:#8a97ab">model says: ' + bodyLine + '</span>';
  tooltipEl.innerHTML = '<b>' + cell.xAxisName + ' ' + cell.xSpeed + ' SPD</b> × <b>' + cell.yAxisName + ' ' + cell.ySpeed + ' SPD</b><br>' + bodyLine;
};
heatmapCanvas.onmouseleave = () => tooltipEl.style.display = 'none';

heatmapCanvas.onclick = e => {
  const hit = getCellFromEvent(e);
  if (!hit) return;
  const { plotState, cell } = hit;
  const speeds = plotState.isFourCharacterTeam ? [cell.dpsSpeed, cell.supportSpeed, cell.support2Speed] : [cell.dpsSpeed, cell.supportSpeed];
  renderTracePanel(plotState.names, speeds, plotState.dokiSpeed, plotState.tieToleranceFraction, plotState.pushAmount, cell.dpsMask);
};

draw();
</script></body></html>
